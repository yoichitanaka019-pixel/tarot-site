<!-- QUICK TAROT v28: 結果画面の任意の位置に追加 -->
<section id="majorGuideLinks" hidden></section>
<script>
const majorGuideSlug = {
  "愚者":"00-the-fool","魔術師":"01-the-magician","女教皇":"02-the-high-priestess","女帝":"03-the-empress","皇帝":"04-the-emperor","教皇":"05-the-hierophant","恋人":"06-the-lovers","戦車":"07-the-chariot","力":"08-strength","隠者":"09-the-hermit","運命の輪":"10-wheel-of-fortune","正義":"11-justice","吊るされた男":"12-the-hanged-man","死神":"13-death","節制":"14-temperance","悪魔":"15-the-devil","塔":"16-the-tower","星":"17-the-star","月":"18-the-moon","太陽":"19-the-sun","審判":"20-judgement","世界":"21-the-world"
};
function renderMajorGuideLinks(selectedCards, lang='ja'){
  const box=document.getElementById('majorGuideLinks'); if(!box)return;
  const majors=selectedCards.filter(x=>majorGuideSlug[x.card?.name||x.name]);
  if(!majors.length){box.hidden=true;return;} box.hidden=false; box.innerHTML='';
  majors.forEach(x=>{const name=x.card?.name||x.name;const slug=majorGuideSlug[name];const a=document.createElement('a');a.href=`/guides/tarot/${slug}/`;a.textContent=lang==='en'?`Learn about ${name} (Japanese)`:`「${name}」について詳しく読む`;a.addEventListener('click',()=>{if(typeof gtag==='function')gtag('event','tarot_card_article_click',{card_name:name,article_slug:slug});});box.appendChild(a);});
}
// renderResult() 等で selected が確定した後に: renderMajorGuideLinks(selected, currentLang);
</script>
