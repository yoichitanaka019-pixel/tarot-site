      opacity: 0;
      transform: translateY(16px);
      animation: oracleRise .86s cubic-bezier(.16, 1, .3, 1) .62s forwards;
    }

      content: "";
      position: absolute;
      left: 50%; top: 0;
      width: 72%; height: 1px;

    }

  

    /* ===== Brush-up v8: スマホ向け流麗化・柔らかな余韻 ===== */
    :root { --flow-ease: cubic-bezier(.22, .78, .28, 1); }

    .deck-card, .drawn-card {
      transition: transform 1.55s var(--flow-ease), opacity 1.15s ease, filter 1.15s ease;
    }
    .deck-card.swirl {
      animation-name: circleShuffleFlow;
      animation-duration: 3.7s;
      animation-timing-function: ease-in-out;
      animation-iteration-count: infinite;
    }
    @keyframes circleShuffleFlow {
      0% { transform: rotate(var(--angle)) translateX(0) rotate(0deg) scale(1.01); }
      25% { transform: rotate(calc(var(--angle) + 54deg)) translateX(calc(var(--radius) * .55)) rotate(34deg) scale(1.045); }
      50% { transform: rotate(calc(var(--angle) + 132deg)) translateX(calc(var(--radius) * .82)) rotate(82deg) scale(.985); }
      75% { transform: rotate(calc(var(--angle) + 224deg)) translateX(calc(var(--radius) * .48)) rotate(138deg) scale(1.025); }
      100% { transform: rotate(calc(var(--angle) + 360deg)) translateX(0) rotate(180deg) scale(1.01); }
    }
    .is-running .deck-stage::before {
      animation-duration: 18s;
      opacity: .64;
      filter: blur(1.8px);
    }
    .deck-card.swirl {
      box-shadow: 0 18px 42px rgba(0,0,0,.52), 0 0 26px rgba(217,180,95,.20), 0 0 42px rgba(143,92,255,.09);
    }

    }

      0%, 100% { box-shadow: 0 20px 48px rgba(0,0,0,.58), 0 0 20px rgba(217,180,95,.18); }
      50% { box-shadow: 0 24px 58px rgba(0,0,0,.64), 0 0 34px rgba(255,241,185,.28), 0 0 52px rgba(143,92,255,.12); }
    }
    .result-area { animation: resultInSoft 1.1s ease both; }
    @keyframes resultInSoft {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .reading-card {
      transform: translateY(12px) scale(.985);
      animation: cardRiseSoft 1.08s var(--flow-ease) forwards;
    }
    @keyframes cardRiseSoft {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .reading-card::before {
      opacity: .42;
      animation-duration: 3.8s;
      animation-timing-function: ease-in-out;
    }
    .oracle-box {
      transform: translateY(10px);
      animation: oracleRiseSoft 1.2s var(--flow-ease) .86s forwards;
    }
    @keyframes oracleRiseSoft {
      to { opacity: 1; transform: translateY(0); }
    }
    .oracle-text {
      letter-spacing: .015em;
      line-height: 2.05;
    }

    @media (max-width: 700px) {
      .deck-stage { height: 430px; }
      .deck-card, .drawn-card { transition-duration: 1.45s; }
      .deck-card.swirl { animation-duration: 3.4s; }
      .drawn-card.arrive { animation-duration: 3.6s; }
      .deck-card::after, .drawn-card::after { animation-duration: 8.2s; opacity: .18; }
      .stage-title { transition-duration: .75s; line-height: 1.8; }
      .oracle-text { font-size: .98rem; line-height: 2.05; }
    }

  

    /* ===== Brush-up v10: 一枚ずつの顕現 → 三枚並び → 結果表示 ===== */
    .single-reveal-stage {
      display: none;
      min-height: clamp(420px, 74vw, 760px);
      margin: 8px auto 22px;
      place-items: center;
    }
    .single-reveal-stage.active { display: grid; }

    .spread.spread-final {
      opacity: 0;
      transform: translateY(18px);
      pointer-events: none;
      transition: opacity .9s var(--flow-ease), transform .9s var(--flow-ease);
    }
    .spread.spread-final.show {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .oracle-box {
      opacity: 0;
      transform: translateY(18px);
      pointer-events: none;
      animation: none !important;
      transition: opacity .95s var(--flow-ease), transform .95s var(--flow-ease);
    }
    .oracle-box.show {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .reading-card.showcase-card {
      width: min(100%, 430px);
      margin: 0 auto;

      box-shadow: 0 26px 70px rgba(0,0,0,.48), 0 0 38px rgba(217,180,95,.16);

    function englishPositionReading(entry, position, category) {
      const name = cardDisplayName(entry.card);
      const energy = englishElementTone(entry);
      const orientation = entry.reversed
        ? 'Because it is reversed, its message is not a warning to fear, but a place to loosen your grip and listen more carefully.'
        : 'Because it is upright, its message can be trusted as a clear thread running through today.';
      if (position === 'present') {
        return `${name} opens the reading by revealing the atmosphere around you now: ${energy}. ${orientation}`;
      }
      if (position === 'challenge') {
        return `${name} shows the gentle challenge in this situation. Something connected to ${energy} may need more patience, honesty, or room to breathe. ${orientation}`;
      }
      return `${name} offers guidance for the next step. Let ${energy} become one small, practical choice rather than a heavy demand. ${orientation}`;

    function englishSpreadTone(entries) {
      const reversedCount = entries.filter(e => e.reversed).length;
      const majorCount = entries.filter(e => e.card.arcana === '大アルカナ').length;
      const notes = [];
      if (majorCount >= 2) {
        notes.push(`With ${majorCount} Major Arcana cards, this is not only about mood or timing; it may be pointing to a larger lesson taking shape beneath the surface.`);
      } else {
        notes.push('This spread leaves room for ordinary choices to gently change the day’s direction.');

      if (reversedCount >= 2) {
        notes.push('Several reversed cards suggest that less pressure may bring more movement. Release what feels forced before adding anything new.');
      } else if (reversedCount === 1) {
        notes.push('The single reversed card marks one tender point in the reading. Give that area patience rather than judgment.');
      } else {
        notes.push('With all three cards upright, the message is comparatively clear: follow the simple step that is already visible.');
      }
      return notes.join(' ');

    function englishSummarySentence(a, b, c, category) {
      const present = cardDisplayName(a.card);

    function setupAudio() {
      Object.values(bgm).forEach(audio => {
        if (!audio) return;
        audio.volume = .32;
        audio.addEventListener('error', function() {
          // BGMファイル未配置でもサイト自体は通常動作させる。
        }, false);
      });
      if (bgm.top) bgm.top.volume = .24;
      if (bgm.shuffle) bgm.shuffle.volume = .34;
      if (bgm.result) bgm.result.volume = .30;

      if (soundToggle) {
        soundToggle.addEventListener('click', function(event) {
          event.preventDefault();
          soundMuted = !soundMuted;
          updateSoundButton();
          if (soundMuted) {
            stopAllBGM();
          } else {
            audioReady = true;
            switchBGM(currentBgm, true);
          }
        }, false);
      }
      updateSoundButton();
    }

    function updateSoundButton() {
      if (!soundToggle) return;
      soundToggle.textContent = soundMuted ? t('soundOff') : t('soundOn');
      soundToggle.setAttribute('aria-pressed', soundMuted ? 'true' : 'false');
    }

    function stopAllBGM() {
      Object.values(bgm).forEach(audio => {
        if (!audio) return;
        try { audio.pause(); } catch (e) {}
      });
    }

    function switchBGM(name, forcePlay) {
      currentBgm = name;
      if (soundMuted) return;
      if (forcePlay) audioReady = true;
      Object.entries(bgm).forEach(([key, audio]) => {
        if (!audio) return;
        if (key !== name) {
          try { audio.pause(); } catch (e) {}
          return;
        }
        try {
          audio.currentTime = audio.currentTime || 0;
          const playPromise = audio.play();
          if (playPromise && typeof playPromise.catch === 'function') {
            playPromise.catch(function() {
              // ユーザー操作前の自動再生制限、またはBGM未配置の場合は無音で続行。
            });
          }
        } catch (e) {}
      });
    }

    function createDeckVisual() {
      stage.querySelectorAll('.deck-card, .drawn-card').forEach(el => el.remove());
      document.querySelectorAll('.pile-label').forEach(el => el.classList.remove('show'));
      visualCards = [];
      const mobile = isMobileView();
      const count = mobile ? 14 : 36;
      const spreadX = mobile ? 1.15 : 2.0;
      for (let i = 0; i < count; i++) {
        const card = document.createElement('div');
        card.className = 'deck-card';
        const angle = (i - count / 2) * (mobile ? 2.05 : 2.7);
        const x = (i - count / 2) * spreadX;
        const y = Math.sin(i * .9) * (mobile ? 4 : 7);
        card.style.zIndex = i + 1;
        card.style.transform = `translate(${x}px, ${y}px) rotate(${angle}deg)`;
        card.style.setProperty('--angle', `${(i * 33) % 360}deg`);
        card.style.setProperty('--radius', `${mobile ? 42 + (i % 7) * 3 : 78 + (i % 9) * 5}px`);
        card.style.setProperty('--delay', `${-(i % 11) * .07}s`);
        stage.appendChild(card);
        visualCards.push(card);
      }
    }

    function startRitual() {
      if (ritualRunning) return;
      const selectedCategory = categorySelect.value;
      const remaining = getCategoryCooldownRemaining(selectedCategory);
      if (remaining > 0) {
        updateCategoryCooldownUI();
        title.textContent = cooldownBlockedMessage(selectedCategory, remaining);
        return;
      }
      ritualRunning = true;
      switchBGM('shuffle', true);
      clearRitualTimers();
      document.body.classList.add('is-running');
      startBtn.disabled = true;
      startBtn.textContent = t('shuffling');
      categorySelect.disabled = true;
      resultArea.style.display = 'none';
      clearResultPresentation();
      if (imageDebug) imageDebug.style.display = 'none';
      if (!visualCards.length) createDeckVisual();

      title.textContent = t('stageShuffling');
      visualCards.forEach((card, i) => {
        card.classList.remove('swirl');
        card.style.opacity = '1';
        card.style.filter = 'brightness(1)';
        card.style.transform = `translate(${(i % 7) - 3}px, ${(i % 5) - 2}px) rotate(${(i % 8) - 4}deg) scale(1.03)`;
      });

      const mobile = isMobileView();
      schedule(() => { visualCards.forEach(card => card.classList.add('swirl')); }, 180);
      schedule(splitIntoPiles, mobile ? 2400 : 3400);
      schedule(drawFromPiles, mobile ? 3900 : 5050);
      schedule(showResult, mobile ? 5600 : 6800);
    }

    function splitIntoPiles() {
      title.textContent = t('stagePiles');
      const mobile = isMobileView();
      const stageWidth = stage.clientWidth || window.innerWidth || 360;
      const gap = mobile ? Math.min(105, Math.max(76, stageWidth * .24)) : 170;
      const pileX = [-gap, 0, gap];
      const pileY = mobile ? [8, -6, 8] : [8, -10, 8];
      visualCards.forEach((card, i) => {
        card.classList.remove('swirl');
        const pile = i % 3;
        const layer = Math.floor(i / 3);
        const jitterX = ((layer % 5) - 2) * (mobile ? 1.4 : 2);
        const jitterY = -layer * (mobile ? .46 : .65);
        const rot = ((layer % 7) - 3) * (mobile ? 1.4 : 1.8);
        card.style.zIndex = 100 + layer;
        card.style.transform = `translate(${pileX[pile] + jitterX}px, ${pileY[pile] + jitterY}px) rotate(${rot}deg) scale(1.02)`;
      });
      document.querySelectorAll('.pile-label').forEach((el, i) => {
        el.style.transform = `translateX(calc(-50% + ${pileX[i]}px))`;
        el.classList.add('show');
      });
    }

    function drawFromPiles() {
      title.textContent = t('stageDrawing');
      selected = pickThreeCards();
      visualCards.forEach((card) => {
        card.style.opacity = '0';
        card.style.filter = 'blur(1.4px) brightness(.70)';
        card.style.transform = `${card.style.transform} scale(.92)`;
      });
      document.querySelectorAll('.pile-label').forEach(el => el.classList.remove('show'));
      const spread = Math.min(170, Math.max(82, (stage.clientWidth || window.innerWidth) * .26));
      [-1, 0, 1].forEach((pos, index) => {
        const card = document.createElement('div');
        card.className = 'drawn-card';
        card.style.setProperty('--spread-x', `${pos * spread}px`);
        card.style.setProperty('--spread-y', `0px`);
        card.style.setProperty('--rot', `${pos * 1.4}deg`);
        card.style.transitionDelay = `${index * .18}s`;
        card.style.zIndex = 300 + index;
        stage.appendChild(card);
        requestAnimationFrame(() => card.classList.add('arrive'));
      });
    }

    function showResult() {
      switchBGM('result', true);
      title.textContent = t('stageSingle');
      stage.querySelectorAll('.drawn-card').forEach(el => el.remove());
      const category = categorySelect.value;
      recordCategoryReading(category);
      clearResultPresentation();
      resultArea.style.display = 'block';
      playResultSequence(selected, category);
      ritualRunning = false;
      categorySelect.disabled = false;
      document.body.classList.remove('is-running');
      updateCategoryCooldownUI();
      try {
        resultArea.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      } catch (e) {
        resultArea.scrollIntoView();
      }
    }

    function resetRitual() {
      clearRitualTimers();
      switchBGM('top', true);
      selected = [];
      ritualRunning = false;
      startBtn.disabled = false;
      startBtn.textContent = t('start');
      categorySelect.disabled = false;
      if (imageDebug) imageDebug.style.display = 'none';
      document.body.classList.remove('is-running');
      clearResultPresentation();
      resultArea.style.display = 'none';
      title.textContent = t('stageDefault');
      updateCategoryCooldownUI();
      createDeckVisual();
      try {
        document.getElementById('ritual-panel').scrollIntoView({ behavior: 'smooth', block: 'start' });
      } catch (e) {
        document.getElementById('ritual-panel').scrollIntoView();
      }
    }

    function readCategoryCooldowns() {
      try {
        const raw = localStorage.getItem(CATEGORY_COOLDOWN_KEY);
        const parsed = raw ? JSON.parse(raw) : {};
        return parsed && typeof parsed === 'object' ? parsed : {};
      } catch (e) {
        return {};
      }
    }

    function writeCategoryCooldowns(data) {
      try {
        localStorage.setItem(CATEGORY_COOLDOWN_KEY, JSON.stringify(data));
      } catch (e) {}
    }

    function cleanupCategoryCooldowns() {
      const data = readCategoryCooldowns();
      const now = Date.now();
      let changed = false;
      Object.keys(data).forEach(category => {
        if (!data[category] || now - Number(data[category]) >= CATEGORY_COOLDOWN_MS) {
          delete data[category];
          changed = true;
        }
      });
      if (changed) writeCategoryCooldowns(data);
      return data;
    }

    function getCategoryCooldownRemaining(category) {
      const data = cleanupCategoryCooldowns();
      const last = Number(data[category] || 0);
      if (!last) return 0;
      return Math.max(0, CATEGORY_COOLDOWN_MS - (Date.now() - last));
    }

    function recordCategoryReading(category) {
      const data = cleanupCategoryCooldowns();
      data[category] = Date.now();
      writeCategoryCooldowns(data);
      updateCategoryCooldownUI();
    }

    function formatCooldownRemaining(ms) {
      const totalMinutes = Math.ceil(ms / 60000);
      const hours = Math.floor(totalMinutes / 60);
      const minutes = totalMinutes % 60;
      if (currentLang === 'en') {
        if (hours <= 0) return `${minutes} min`;
        if (minutes <= 0) return `${hours}h`;
        return `${hours}h ${minutes}m`;
      }
      if (hours <= 0) return `${minutes}分`;
      if (minutes <= 0) return `${hours}時間`;
      return `${hours}時間${minutes}分`;
    }

    function updateCategoryCooldownUI() {
      if (!categorySelect || !startBtn) return;
      cleanupCategoryCooldowns();
      Array.from(categorySelect.options).forEach(option => {
        const remaining = getCategoryCooldownRemaining(option.value);
        option.disabled = remaining > 0 && option.value !== categorySelect.value;
        const baseLabel = categoryDisplayName(option.value);
        option.textContent = remaining > 0
          ? currentLang === 'en'
            ? `${baseLabel} (${formatCooldownRemaining(remaining)} left)`
            : `${baseLabel}（あと${formatCooldownRemaining(remaining)}）`
          : baseLabel;
      });

      const category = categorySelect.value;
      const remaining = getCategoryCooldownRemaining(category);
      if (cooldownNote) {
        if (remaining > 0) {
          cooldownNote.classList.add('is-locked');
          cooldownNote.textContent = categoryCooldownNote(category, remaining);
        } else {
          cooldownNote.classList.remove('is-locked');
          cooldownNote.textContent = t('cooldownDefault');
        }
      }
      if (!ritualRunning) {
        startBtn.disabled = remaining > 0;
        startBtn.textContent = remaining > 0 ? t('waiting') : t('start');
      }
    }

    function pickThreeCards() {
      const copy = [...deck];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy.slice(0, 3).map(card => ({ card, reversed: Math.random() < 0.5 }));
    }

    function clearResultPresentation() {
      if (singleRevealStage) {
        singleRevealStage.classList.remove('active');
        singleRevealStage.innerHTML = '';
      }
      if (spreadEl) {
        spreadEl.innerHTML = '';
        spreadEl.classList.remove('show');
      }
      if (oracleBox) oracleBox.classList.remove('show');
      if (oracleText) oracleText.textContent = '';
      renderMerchCTA([]);
    }

    function playResultSequence(entries, category) {
      const mobile = isMobileView();
      const singleVisible = mobile ? 1520 : 1720;
      const singleOffset = mobile ? 1680 : 1900;
      const spreadDelay = entries.length * singleOffset + (mobile ? 120 : 180);
      const oracleDelay = spreadDelay + (mobile ? 980 : 1120);

      singleRevealStage.classList.add('active');

      entries.forEach((entry, index) => {
        schedule(() => {
          const slot = slots[index];
          title.textContent = revealSlotMessage(slot);
          showSingleRevealCard(entry, slot, category);
        }, index * singleOffset);
      });

      schedule(() => {
        title.textContent = t('stageSpread');
        singleRevealStage.classList.remove('active');
        singleRevealStage.innerHTML = '';
        renderFinalSpread(entries, category);
      }, spreadDelay);

      schedule(() => {
        title.textContent = t('stageOracle');
        oracleText.textContent = makeOracle(entries, category);
        renderMerchCTA(entries);
        oracleBox.classList.add('show');
      }, oracleDelay);
    }

    function showSingleRevealCard(entry, slot, category) {
      singleRevealStage.innerHTML = '';
      const cardEl = createReadingCard(entry, slot, category, 0, 'showcase');
      singleRevealStage.appendChild(cardEl);
      requestAnimationFrame(() => {
        cardEl.classList.add('showcase-visible');
      });
      schedule(() => {
        cardEl.classList.add('showcase-leave');
      }, isMobileView() ? 1220 : 1380);
    }

    function renderFinalSpread(entries, category) {
      spreadEl.innerHTML = '';
      entries.forEach((entry, index) => {
        spreadEl.appendChild(createReadingCard(entry, slots[index], category, index, 'spread'));
      });
      requestAnimationFrame(() => spreadEl.classList.add('show'));
    }

    function getMajorArcanaMerch(entries) {
      const seen = new Set();
      return entries
        .filter(entry => entry && entry.card && entry.card.arcana === '大アルカナ')
        .map(entry => {
          const name = entry.card.name;
          if (seen.has(name)) return null;
          seen.add(name);
          const url = MAJOR_ARCANA_MERCH_URLS[name] || CREATOR_SHOP_URL;
          return {
            name,
            url,
            fallback: !MAJOR_ARCANA_MERCH_URLS[name] || url === CREATOR_SHOP_URL
          };
        })
        .filter(Boolean);
    }

    function renderMerchCTA(entries) {
      if (!merchCTA || !merchTitle || !merchText || !merchLinks || !merchNote) return;
      const merchItems = getMajorArcanaMerch(entries || []);
      merchLinks.innerHTML = '';
      merchNote.textContent = '';

      if (!merchItems.length) {
        merchCTA.hidden = true;
        return;
      }

      merchCTA.hidden = false;
      if (currentLang === 'en') {
        if (merchItems.length === 1) {
          const name = majorCardDisplayName(merchItems[0].name);
          merchTitle.textContent = `Wear ${name} as a daily charm.`;
          merchText.textContent = `A Major Arcana card, ${name}, appeared in your reading. You can visit the matching T-shirt page from here.`;
        } else {
          merchTitle.textContent = 'Wear the Major Arcana that appeared today.';
          merchText.textContent = `${merchItems.length} Major Arcana cards appeared. Choose the one that stays with you most.`;
        }
      } else if (merchItems.length === 1) {
        merchTitle.textContent = `「${merchItems[0].name}」を、日常のお守りに。`;
        merchText.textContent = `今回のリーディングでは、大アルカナ「${merchItems[0].name}」が現れました。今回のメッセージの余韻をそのまま持ち帰りたい方へ、同じカードのTシャツをご案内します。`;
      } else {
        merchTitle.textContent = '現れた大アルカナを、日常のお守りに。';
        merchText.textContent = `今回は大アルカナが${merchItems.length}枚出ました。気になったカードと同じ絵柄のTシャツへ、そのまま進めます。`;
      }

      merchItems.forEach(item => {
        const link = document.createElement('a');
        link.className = 'merch-btn';
        link.href = item.url;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.textContent = currentLang === 'en'
          ? `View the ${majorCardDisplayName(item.name)} T-shirt`
          : `「${item.name}」のTシャツを見る`;
        merchLinks.appendChild(link);
      });

      if (merchItems.some(item => item.fallback)) {
        merchNote.textContent = currentLang === 'en'
          ? '※ Some cards may open the creator page if the individual product page cannot be confirmed.'
          : '※ 一部のカードは個別商品ページ未確認のため、クリエイターページへご案内します。';
      }

    function createReadingCard(entry, slot, category, index, mode = 'spread') {
      const { card, reversed } = entry;
      const wrapper = document.createElement('article');
      wrapper.className = 'reading-card';
      if (mode === 'showcase') {
        wrapper.classList.add('showcase-card');
      } else {
        wrapper.style.setProperty('--reveal-delay', ((index || 0) * .16) + 's');
      }
      const imageBox = document.createElement('div');
      imageBox.className = `card-image-box${reversed ? ' reversed' : ''}`;
      const img = document.createElement('img');
      img.alt = card.name;
      setImageWithFallback(img, card.file, imageBox);
      const fallback = document.createElement('div');
      fallback.className = 'fallback-card';
      fallback.innerHTML = `<div><strong>${escapeHTML(cardDisplayName(card))}</strong><small>${escapeHTML(card.en)}<br>${escapeHTML(arcanaText(card))}${card.suit ? '・' + escapeHTML(suitText(card.suit)) : ''}</small></div>`;
      imageBox.append(img, fallback);
      const meta = document.createElement('div');
      meta.className = 'card-meta';
      meta.innerHTML = `
        <div class="slot-name">${escapeHTML(slotName(slot))}</div>
        <div class="card-name">${escapeHTML(cardDisplayName(card))}</div>
        <span class="orientation">${escapeHTML(orientationText(reversed))} / ${escapeHTML(arcanaText(card))}</span>
        <p class="mini-reading">${escapeHTML(makeCardMessage(entry, slot, category))}</p>
      `;
      wrapper.append(imageBox, meta);
      return wrapper;
    }

    function setImageWithFallback(img, files, imageBox) {
      let idx = 0;
      const candidates = buildImageCandidates(files);
      const tried = [];

      function tryNext() {
        if (idx >= candidates.length) {
          imageBox.classList.add('no-image');
          if (imageDebug) {
            imageDebug.style.display = 'block';
            imageDebug.innerHTML = '<span class="debug-pill">画像が見つからないカードがあります。例：' + escapeHTML((tried[0] || 'The Fool.jpg')) + ' をHTMLと同じフォルダに置いてください。裏面は card back.jpg です。</span>';
          }
          return;
        }
        const src = candidates[idx++];
        tried.push(src);
        img.src = src;
      }

      img.onload = function() {
        imageBox.classList.remove('no-image');
      };
      img.onerror = tryNext;
      tryNext();
    }

    function buildImageCandidates(files) {
      const sourceFiles = Array.isArray(files) ? files : [files];
      const exts = ['.jpg', '.jpeg', '.JPG', '.JPEG'];
      const candidates = [];
      const pushUnique = function(value) {
        if (!value) return;
        if (!candidates.includes(value)) candidates.push(value);
      };
      const stripExt = function(name) { return String(name).replace(/\.(jpg|jpeg|png|webp)$/i, ''); };
      const safeURI = function(name) {
        try {
          return name.split('/').map(function(part) { return encodeURIComponent(part); }).join('/');
        } catch (e) {
          return name;
        }
      };

      sourceFiles.forEach(function(file) {
        const base = stripExt(file);
        const names = [base];
        // よく起きる表記違いを吸収する。
        if (base === '死') names.push('死神');
        if (base === '死神') names.push('死');
        if (base === '法王') names.push('教皇');
        if (base === '教皇') names.push('法王');
        if (base === '恋人たち') names.push('恋人');
        if (base === '恋人') names.push('恋人たち');
        if (base === '吊るされた男') names.push('吊られた男');
        if (base === '吊られた男') names.push('吊るされた男');
        if (/^ワンドのA$/.test(base)) names.push('ワンドA', 'ワンドの1', 'ワンド1', 'ワンド_ACE', 'wands_ace');
        const numMatch = base.match(/^ワンドの(\d+)$/);
        if (numMatch) names.push('ワンド' + numMatch[1], 'ワンド_' + numMatch[1], 'wands_' + numMatch[1]);
        const court = base.match(/^ワンドの(.+)$/);
        if (court) names.push('ワンド' + court[1], 'wands_' + court[1]);


        // 英語ファイル名対応: ACE_OF_WANDS -> Ace of Wands / THE_FOOL -> The Fool
        if (/^[A-Z_]+$/.test(base)) {
          const englishTitle = base.split('_').map(function(part) {
            return part === 'OF' ? 'of' : part.charAt(0) + part.slice(1).toLowerCase();
          }).join(' ');
          names.push(englishTitle);
        }

        names.forEach(function(name) {
          exts.forEach(function(ext) {
            const filename = name + ext;
            pushUnique(filename);
            pushUnique('./' + filename);
            pushUnique(safeURI(filename));
            pushUnique('./' + safeURI(filename));
          });
        });
      });
      return candidates;
    }

    function orientationKey(entry) { return entry.reversed ? 'reversed' : 'upright'; }

    function makeCardMessage(entry, slot, category) {
      if (currentLang === 'en') return makeCardMessageEnglish(entry, slot, category);
      const parts = getCardMeaning(entry, category);
      const positionIntro = slot.label === '現在'
        ? '今の心の向き'
        : slot.label === '課題'
          ? '少し整えたいところ'
          : '次に選ぶとよい姿勢';
      const key = slot.label === '助言' ? 'advice' : slot.label === '課題' ? 'obstacle' : 'psychology';
      return `${slot.label}の位置に出た${cardLabel(entry)}は、「${activeWords(entry)}」の気配を帯びています。${positionIntro}としては、${parts[key]}。`;
    }

    function makeCardMessageEnglish(entry, slot, category) {
      const role = slotLabel(slot);
      const categoryName = categoryDisplayName(category);
      const cardName = cardDisplayName(entry.card);
      const energy = englishElementTone(entry);
      const orientation = entry.reversed
        ? 'Its reversed position asks you to soften pressure, pause before reacting, and notice where the energy has become blocked.'
        : 'Its upright position suggests this energy can be used honestly, gently, and with more trust in your own timing.';
      const position = slot.key === 'present'
        ? 'reveals the atmosphere surrounding you now'
        : slot.key === 'issue'
          ? 'shows the place where a little patience or care may change the flow'
          : 'offers a quiet direction for your next step';
      return `In the ${role} position, ${cardName} ${position}. Around ${categoryName}, it speaks of ${energy}. ${orientation}`;
    }

    function makeOracle(entries, category) {
      if (currentLang === 'en') return makeOracleEnglish(entries, category);
      const [a, b, c] = entries;
      const relation = makeRelationSentence(a, b, category);
      const advice = makeAdviceSentence(a, b, c, category);
      const tone = makeToneSentence(entries, category);
      const summary = makeSummarySentence(a, b, c, category);
      rememberOraclePattern(entries, category);
      return `今回の三枚は、
現在：${cardLabel(a)}
課題：${cardLabel(b)}
助言：${cardLabel(c)}
という流れで並びました。

${relation}
${advice}
${tone}

${summary}`;
    }

    function makeOracleEnglish(entries, category) {
      const [a, b, c] = entries;
      const categoryName = categoryDisplayName(category);
      rememberOraclePattern(entries, category);
      return `Your three-card message:
Present: ${cardLabel(a)}
Challenge: ${cardLabel(b)}
Guidance: ${cardLabel(c)}

${englishPositionReading(a, 'present', category)}
${englishPositionReading(b, 'challenge', category)}
${englishPositionReading(c, 'guidance', category)}

For ${categoryName}, ${englishCategoryGuidance(category)}

${englishSpreadTone(entries)}

Summary: ${englishSummarySentence(a, b, c, category)}`;
    }

    function cardLabel(entry) {
      if (currentLang === 'en') {
        return `${cardDisplayName(entry.card)} (${orientationText(entry.reversed)})`;
      }
      return `「${entry.card.name}」${entry.reversed ? '逆位置' : '正位置'}`;
    }

    function activeWordList(entry) {
      const words = entry.reversed ? entry.card.reversed : entry.card.keywords;
      return Array.isArray(words) && words.length ? words : ['変化', '選択'];
    }

    function activeWords(entry) {
      return activeWordList(entry).slice(0, 2).join('・');
    }

    function firstWord(entry) {
      return activeWordList(entry)[0] || '変化';
    }

    function secondWord(entry) {
      return activeWordList(entry)[1] || firstWord(entry);
    }

    function categoryLens(category) {

          theme: '心の距離と本音',
          gentleFocus: '相手の気持ちを追いかけすぎず、あなた自身が安心できる距離も大切にすること',
          softStep: '短い言葉で、今の気持ちをそっと伝えること',

        },
        '仕事': {
          theme: '成果、評価、次の一手',
          gentleFocus: '評価を急いで求めるより、今できる小さな成果を丁寧に形にすること',
          softStep: '今日中に終えられる一つの作業を、静かに仕上げること',
          release: '焦って広げすぎること'
        },
        '健康': {
          theme: '心身の負荷と回復',
          gentleFocus: '頑張れるかどうかより、どこで力を抜けるかを見つけること',
          softStep: '睡眠、食事、休憩のどれか一つを少しだけ整えること',

        },

          softStep: '結論を急がず、まず「今どう感じているか」を聞いてみること',
          release: '決めつけたまま話を進めること'
        },

          theme: '信頼と境界線',
          gentleFocus: 'すべての人に合わせるより、心が疲れない距離を選ぶこと',
          softStep: '返事を急がず、落ち着いてから言葉を選ぶこと',
          release: '無理な即答や愛想だけの返事'
        },

    function suitTone(entry) {
      if (entry.card.suit === 'ワンド') {
        return { feeling: '動き出したい気持ち', care: '勢いを少しだけ整える', gift: '熱量', shadow: '焦り' };
      }
      if (entry.card.suit === 'カップ') {
        return { feeling: '気持ちを受け取りたい心', care: '感情をやわらかく言葉にする', gift: 'やさしさ', shadow: '期待のふくらみ' };
      }
      if (entry.card.suit === 'ソード') {
        return { feeling: 'はっきりさせたい思い', care: '言葉を短く澄ませる', gift: '判断力', shadow: '考えすぎ' };
      }
      if (entry.card.suit === 'ペンタクル') {
        return { feeling: '現実を安定させたい感覚', care: '予定や条件を少し整える', gift: '落ち着き', shadow: '重さや停滞' };
      }
      return { feeling: '心の奥で流れを変えたい感覚', care: 'いつもの態度を少し変える', gift: '気づき', shadow: '意味を急いで決めること' };
    }

    function getCardMeaning(entry, category) {
      const lens = categoryLens(category);
      const tone = suitTone(entry);
      const w1 = firstWord(entry);
      const w2 = secondWord(entry);
      if (entry.reversed) {
        return {
          psychology: `${w1}や${w2}が少し強く出て、心が急ぎすぎているのかもしれません`,
          action: `${tone.care}前に、${lens.release}をそっと脇へ置いてみること`,
          obstacle: `${w1}に意識が向きすぎて、${lens.theme}の中で${tone.shadow}が出やすいところです`,
          advice: `${w2}を悪いことと決めつけず、${lens.softStep}があなたを楽にしてくれます`
        };
      }
      return {
        psychology: `${w1}が自然に前へ出て、${tone.feeling}を扱いやすい時です`,
        action: `${tone.care}ことで、${w2}が穏やかな流れに変わっていきます`,
        obstacle: `良い流れがあるからこそ、${lens.gentleFocus}を忘れないでください`,
        advice: `${w1}を大きな決断にしすぎず、${lens.softStep}が助けになります`
      };
    }

    function makeRelationSentence(a, b, category) {
      const current = getCardMeaning(a, category);
      const issue = getCardMeaning(b, category);
      const variants = [
        () => `現在と課題には、${cardLabel(a)}の「${activeWords(a)}」と、${cardLabel(b)}の「${activeWords(b)}」が並んでいます。今は、${current.psychology}。ただ、課題の側では、${issue.obstacle}。急いで整えようとしなくて大丈夫です。`,
        () => `現在と課題を見ると、前へ進みたい気持ちと、少し立ち止まって見直したい部分が重なっています。${cardLabel(a)}は、${current.psychology}と教えてくれています。一方で${cardLabel(b)}は、${issue.obstacle}と静かに告げています。`,
        () => `現在と課題には、${firstWord(a)}から${firstWord(b)}へ向かう細い糸のような流れがあります。表では${current.psychology}。その奥では、${issue.obstacle}。まずはその両方を、否定せずに見てあげてください。`,
        () => `現在と課題には、${cardLabel(a)}の流れをそのまま押し通すより、${cardLabel(b)}の「${activeWords(b)}」をやさしく整える必要が出ています。無理に変えるのではなく、気づいたところから少しで十分です。`
      ];
      return chooseOracleVariant('relation', variants)();
    }

    function makeAdviceSentence(a, b, c, category) {
      const advice = getCardMeaning(c, category);
      const lens = categoryLens(category);
      const variants = [
        () => `助言の${cardLabel(c)}は、${advice.advice}。今日は、${lens.gentleFocus}を思い出してみてください。`,
        () => `最後に出た${cardLabel(c)}は、答えを急がず、${advice.action}と伝えています。${lens.release}から少し離れるほど、心に余白が戻ります。`,
        () => `助言としては、${cardLabel(c)}の「${activeWords(c)}」を、今日できる小さな行動に変えることです。大きく動かさなくても、${lens.softStep}だけで流れは変わり始めます。`,
        () => `${cardLabel(c)}が差し出しているのは、強い命令ではなく、${advice.advice}というやわらかな合図です。現在と課題を一気に解こうとせず、一つだけ整えてみてください。`
      ];
      return chooseOracleVariant('advice', variants)();
    }

    function makeToneSentence(entries, category) {
      const reversedCount = entries.filter(e => e.reversed).length;
      const majorCount = entries.filter(e => e.card.arcana === '大アルカナ').length;
      const mainSuit = dominantSuit(entries);
      const variants = [];

      if (mainSuit) {
        const tone = suitTone(entries.find(e => e.card.suit === mainSuit));
        variants.push(() => `${mainSuit}の気配が少し強く出ています。鍵は${tone.gift}ですが、${tone.shadow}にならないよう、ゆっくり扱ってください。`);
        variants.push(() => `三枚の中では${mainSuit}の性質が目立ちます。${tone.care}ことが、今日の流れをやさしく整えてくれます。`);
      }
      if (majorCount >= 2) {
        variants.push(() => `大アルカナが${majorCount}枚出ています。これは偶然の気分というより、あなたの中で少し大きな節目が動いている合図かもしれません。`);
      } else {
        variants.push(() => `今回は、日々の選び方で変えられる余地が大きい配置です。言葉、予定、距離感のどれか一つを丁寧にするだけで十分です。`);
      }
      if (reversedCount >= 2) {
        variants.push(() => `逆位置が重なっています。今日は何かを増やすより、期待や負担を少し軽くする方が、流れは整いやすいでしょう。`);
      } else if (reversedCount === 1) {
        const rev = entries.find(e => e.reversed);
        variants.push(() => `逆位置は${cardLabel(rev)}だけです。そこを責める必要はありません。ひとつの引っかかりに気づけたなら、もう十分に前へ進み始めています。`);
      } else {
        variants.push(() => `三枚とも正位置です。流れは比較的素直ですから、疑いすぎず、見えている一歩を静かに選んでみてください。`);
      }
      return chooseOracleVariant('tone', variants)();
    }

    function makeSummarySentence(a, b, c, category) {
      const seed = summarySeed(a, b, c, category);
      const currentNoun = pickBySeed(['土台', '灯り', '起点', '内なる力'], seed);
      const issueNoun = pickBySeed(['整える扉', '見直す場所', 'ほどく糸', '越えていく波'], seed + 3);
      const adviceNoun = pickBySeed(['次の一歩', '進む方向', 'やさしい答え', '明日の合図'], seed + 7);
      const current = `${a.card.name}の「${firstWord(a)}」は今の${currentNoun}`;
      const issue = `${b.card.name}の「${firstWord(b)}」は${issueNoun}`;
      const advice = `${c.card.name}の「${firstWord(c)}」は${adviceNoun}`;
      const outcome = summaryOutcome(c, category, seed);
      return `まとめると、${current}、${issue}、${advice}です。${outcome}`;
    }

    function summarySeed(a, b, c, category) {
      const raw = `${category}|${a.card.id}:${a.reversed ? 'R' : 'U'}|${b.card.id}:${b.reversed ? 'R' : 'U'}|${c.card.id}:${c.reversed ? 'R' : 'U'}`;
      let hash = 0;
      for (let i = 0; i < raw.length; i++) {
        hash = ((hash << 5) - hash + raw.charCodeAt(i)) | 0;
      }
      return Math.abs(hash);
    }

    function pickBySeed(list, seed) {
      return list[seed % list.length];
    }

    function summaryOutcome(adviceEntry, category, seed) {
      const suit = adviceEntry.card.suit || '大アルカナ';
      const movement = adviceEntry.reversed
        ? pickBySeed(['力を抜いたぶん', '一度立ち止まるほど', '抱え込みをほどくほど', '結論をやわらかく待つほど'], seed + 11)
        : pickBySeed(['素直に動かすほど', '小さく形にするほど', '今日の一歩に移すほど', '心を開いて扱うほど'], seed + 13);

      const outcomes = {
        '恋愛': {
          'ワンド': 'ふたりの温度が少しずつ戻ります。',
          'カップ': 'やさしい本音が相手に届きやすくなります。',
          'ソード': '言葉のすれ違いが静かにほどけていきます。',
          'ペンタクル': '安心できる距離と約束が育っていきます。',
          '大アルカナ': 'この恋に必要な気づきが、自然に見えてきます。'
        },
        '仕事': {
          'ワンド': '停滞していた流れに動きが生まれます。',
          'カップ': '周囲との呼吸が合い、助けを受け取りやすくなります。',
          'ソード': '判断が澄み、次に選ぶべき作業が見えてきます。',
          'ペンタクル': '成果につながる形が、少しずつ固まっていきます。',
          '大アルカナ': '今の役割に込める意味が、静かに定まっていきます。'
        },
        '健康': {
          'ワンド': '身体に戻る元気を、無理なく使いやすくなります。',
          'カップ': '心の緊張がゆるみ、回復の余白が生まれます。',
          'ソード': '考えすぎていた不安を、整理しやすくなります。',
          'ペンタクル': '生活のリズムが整い、安心して休みやすくなります。',
          '大アルカナ': '心身が求めている変化に、やさしく気づけます。'
        },
        '家族': {
          'ワンド': '家の中に、前向きな会話のきっかけが戻ります。',
          'カップ': '言えなかった気持ちを、穏やかに受け止め合えます。',
          'ソード': '絡まっていた言葉がほどけ、話しやすくなります。',
          'ペンタクル': '日々の約束や役割が、少しずつ安定します。',
          '大アルカナ': '家族の中で大切にしたいものが見えやすくなります。'
        },
        '人間関係': {
          'ワンド': '関係に新しい風が入り、動き出しやすくなります。',
          'カップ': 'やさしい距離感が戻り、心が通いやすくなります。',
          'ソード': '境界線がはっきりし、無理なく向き合えます。',
          'ペンタクル': '信頼を積み直すための現実的な一歩が見えます。',
          '大アルカナ': '誰とどう関わるか、大切な軸が見えてきます。'
        },
        'ギャンブル': {
          'ワンド': '勢いを味方にしつつ、熱くなりすぎず動けます。',
          'カップ': '気分に流されず、自分の感覚を静かに扱えます。',
          'ソード': '勝負どころと引き際を、冷静に見分けやすくなります。',
          'ペンタクル': '金額や時間の線引きが、結果を守ってくれます。',
          '大アルカナ': '流れに飲まれず、今の勝負の意味を見極められます。'
        }
      };

      const categoryOutcomes = outcomes[category] || {};
      const ending = categoryOutcomes[suit] || categoryOutcomes['大アルカナ'] || '明るい流れを受け取りやすくなります。';
      return `${movement}、${ending}`;
    }

    function positiveDirection(category) {
      return {
        '恋愛': '安心できる関係',
        '仕事': '次の成果',
        '健康': '心身の回復',
        '家族': 'あたたかな対話',
        '人間関係': '心地よい距離感',
        'ギャンブル': '落ち着いた判断'
      }[category] || '明るい流れ';
    }

    function dominantSuit(entries) {
      const counts = {};
      entries.forEach(e => {
        if (!e.card.suit) return;
        counts[e.card.suit] = (counts[e.card.suit] || 0) + 1;
      });
      const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);
      if (!sorted.length) return '';
      return sorted[0][1] >= 2 ? sorted[0][0] : '';
    }

    function oraclePatternSignature(entries, category) {
      return `${category}|${entries.map(e => `${e.card.id}:${e.reversed ? 'R' : 'U'}`).join('|')}`;
    }

    function chooseOracleVariant(section, variants) {
      if (!variants.length) return () => '';
      const historyKey = 'tarot_oracle_variant_history_v8';
      let history = [];
      try {
        history = JSON.parse(localStorage.getItem(historyKey) || '[]');
        if (!Array.isArray(history)) history = [];
      } catch (e) { history = []; }
      const recent = history.filter(item => item && item.section === section).map(item => item.index);
      let choices = variants.map((_, index) => index).filter(index => !recent.includes(index));
      if (!choices.length) choices = variants.map((_, index) => index);
      const index = choices[Math.floor(Math.random() * choices.length)];
      history.unshift({ section, index, time: Date.now() });
      history = history.slice(0, 18);
      try { localStorage.setItem(historyKey, JSON.stringify(history)); } catch (e) {}
      return variants[index];
    }

    function rememberOraclePattern(entries, category) {
      const key = 'tarot_recent_spreads_v8';
      let history = [];
      try {
        history = JSON.parse(localStorage.getItem(key) || '[]');
        if (!Array.isArray(history)) history = [];
      } catch (e) { history = []; }
      history.unshift({ spread: oraclePatternSignature(entries, category), time: Date.now() });
      history = history.slice(0, 12);
      try { localStorage.setItem(key, JSON.stringify(history)); } catch (e) {}
    }


    function escapeHTML(str) {
      return String(str).replace(/[&<>'"]/g, (tag) => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[tag]));
    }
  </script>
