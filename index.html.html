<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>三枚神託タロット β｜カテゴリ専用文章版</title>
  <style>
    :root {
      --bg0: #05030c;
      --bg1: #111027;
      --panel: rgba(19, 18, 43, .76);
      --gold: #d9b45f;
      --gold2: #fff1b9;
      --purple: #8f5cff;
      --rose: #e85d8c;
      --text: #fff8e9;
      --muted: #cfc5e8;
      --card-w: clamp(92px, 27vw, 176px);
      --card-h: calc(var(--card-w) * 1.61);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", "Times New Roman", serif;
      background:
        radial-gradient(circle at 50% 0%, rgba(143, 92, 255, .35), transparent 34rem),
        radial-gradient(circle at 12% 18%, rgba(232, 93, 140, .18), transparent 24rem),
        linear-gradient(180deg, var(--bg1), var(--bg0) 62%, #000);
      overflow-x: hidden;
    }
    body::before,
    body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: -1; }
    body::before {
      opacity: .42;
      background-image:
        radial-gradient(circle, rgba(255,255,255,.9) 0 1px, transparent 1.6px),
        radial-gradient(circle, rgba(217,180,95,.72) 0 1px, transparent 1.4px);
      background-size: 98px 98px, 153px 153px;
      background-position: 0 0, 27px 43px;
      animation: starDrift 22s linear infinite;
    }
    body::after { background: radial-gradient(circle at center, transparent 52%, rgba(0,0,0,.55)); }
    @keyframes starDrift { from { transform: translateY(0); } to { transform: translateY(98px); } }

    .app { width: min(1180px, 100%); margin: 0 auto; padding: 34px clamp(18px, 4vw, 54px) 72px; }
    .hero { text-align: center; padding: clamp(32px, 7vw, 92px) 0 20px; }
    .eyebrow {
      display: inline-flex; align-items: center; gap: .65rem; padding: 9px 16px;
      border: 1px solid rgba(217,180,95,.35); border-radius: 999px; color: var(--gold2);
      background: rgba(255,255,255,.05); box-shadow: 0 0 40px rgba(217,180,95,.11);
      font-size: .86rem; letter-spacing: .12em;
    }
    h1 { margin: 26px auto 16px; font-size: clamp(2.2rem, 8vw, 5.3rem); letter-spacing: .08em; line-height: 1.06; text-shadow: 0 0 22px rgba(217,180,95,.28), 0 12px 40px rgba(0,0,0,.5); }
    .lead { max-width: 760px; margin: 0 auto; color: var(--muted); line-height: 1.9; font-size: clamp(.98rem, 2.2vw, 1.12rem); }

    .ritual-panel {
      width: 100%; margin: 34px auto 0; padding: clamp(18px, 3.5vw, 36px);
      border: 1px solid rgba(217,180,95,.34); border-radius: 34px;
      background: linear-gradient(180deg, rgba(255,255,255,.09), rgba(255,255,255,.03)), var(--panel);
      box-shadow: 0 28px 90px rgba(0,0,0,.45), inset 0 0 55px rgba(217,180,95,.04);
      backdrop-filter: blur(16px); position: relative; overflow: hidden;
    }
    .ritual-panel::before {
      content: ""; position: absolute; inset: -2px;
      background: radial-gradient(circle at 50% 0%, rgba(217,180,95,.2), transparent 20rem), radial-gradient(circle at 20% 88%, rgba(143,92,255,.14), transparent 20rem);
      pointer-events: none;
    }
    .ritual-panel > * { position: relative; }

    .controls { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: end; max-width: 780px; margin: 0 auto 20px; }
    label { display: block; margin: 0 0 9px; color: var(--gold2); letter-spacing: .08em; font-size: .9rem; }
    select, button { width: 100%; min-height: 54px; border: none; border-radius: 18px; font-size: 1rem; font-family: inherit; }
    select {
      appearance: none; color: var(--text); padding: 0 46px 0 18px; border: 1px solid rgba(217,180,95,.3);
      background: linear-gradient(45deg, transparent 50%, var(--gold2) 50%) right 19px center / 9px 9px no-repeat, linear-gradient(135deg, var(--gold2) 50%, transparent 50%) right 12px center / 9px 9px no-repeat, rgba(9, 8, 24, .82);
      box-shadow: inset 0 0 24px rgba(0,0,0,.35); outline: none;
    }
    .primary-btn { width: min(250px, 100%); padding: 0 24px; color: #231000; font-weight: 800; letter-spacing: .08em; cursor: pointer; background: linear-gradient(135deg, #fff1b9, #d7aa4c 48%, #ffcf6b); box-shadow: 0 14px 32px rgba(217,180,95,.25), inset 0 1px 0 rgba(255,255,255,.7); transition: transform .25s ease, filter .25s ease, opacity .25s ease; white-space: nowrap; }
    .primary-btn:hover { transform: translateY(-2px); filter: brightness(1.08); }
    .primary-btn:active { transform: translateY(1px) scale(.99); }
    .primary-btn:disabled { opacity: .55; cursor: not-allowed; transform: none; filter: grayscale(.5); }

    .stage-title { min-height: 2.2rem; margin: 12px auto 0; text-align: center; color: var(--gold2); letter-spacing: .08em; font-size: clamp(.95rem, 2vw, 1.05rem); transition: opacity .35s ease, transform .35s ease; }
    .deck-stage { position: relative; width: 100%; height: clamp(380px, 58vw, 600px); margin: 6px auto 0; perspective: 1400px; overflow: visible; }
    .deck-card, .drawn-card {
      position: absolute; left: 50%; top: 50%; width: clamp(62px, 12vw, 92px); height: calc(clamp(62px, 12vw, 92px) * 1.61);
      margin-left: calc(clamp(62px, 12vw, 92px) / -2); margin-top: calc(clamp(62px, 12vw, 92px) * -0.805);
      border-radius: 10px; border: 1px solid rgba(217,180,95,.78);
      background: radial-gradient(circle at 50% 32%, rgba(255,241,185,.18), transparent 23%), radial-gradient(circle at 50% 50%, rgba(143,92,255,.18), transparent 42%), linear-gradient(145deg, #1b1034, #05030c 66%, #2a0d1f);
      box-shadow: 0 12px 28px rgba(0,0,0,.55), 0 0 18px rgba(217,180,95,.12);
      transform-style: preserve-3d; transition: transform .95s cubic-bezier(.16, 1, .3, 1), opacity .7s ease, filter .7s ease; will-change: transform, opacity;
    }
    .deck-card::before, .drawn-card::before { content: "✦"; position: absolute; inset: 8px; display: grid; place-items: center; border: 1px solid rgba(217,180,95,.32); border-radius: 8px; color: rgba(255,241,185,.8); font-size: 1.4rem; text-shadow: 0 0 18px rgba(217,180,95,.6); }
    .deck-card.swirl { animation: circleShuffle 1.45s cubic-bezier(.45, .03, .32, .98) infinite; animation-delay: var(--delay); }
    @keyframes circleShuffle {
      0% { transform: rotate(var(--angle)) translateX(0) rotate(0deg) scale(1.02); }
      28% { transform: rotate(calc(var(--angle) + 122deg)) translateX(var(--radius)) rotate(140deg) scale(1.16); }
      55% { transform: rotate(calc(var(--angle) + 260deg)) translateX(calc(var(--radius) * .78)) rotate(270deg) scale(.92); }
      82% { transform: rotate(calc(var(--angle) + 368deg)) translateX(var(--radius)) rotate(392deg) scale(1.12); }
      100% { transform: rotate(calc(var(--angle) + 450deg)) translateX(0) rotate(540deg) scale(1.02); }
    }
    .pile-label { position: absolute; left: 50%; top: calc(50% + clamp(72px, 14vw, 112px)); transform: translateX(-50%); color: rgba(255,241,185,.8); background: rgba(0,0,0,.32); border: 1px solid rgba(217,180,95,.25); border-radius: 999px; padding: 7px 12px; font-size: .78rem; letter-spacing: .08em; opacity: 0; transition: opacity .35s ease; white-space: nowrap; }
    .pile-label.show { opacity: 1; }
    .drawn-card { width: var(--card-w); height: var(--card-h); margin-left: calc(var(--card-w) / -2); margin-top: calc(var(--card-h) / -2); cursor: default; transform: translate(var(--spread-x), var(--spread-y)) rotate(var(--rot)) scale(.96); opacity: 0; }
    .drawn-card.arrive { opacity: 1; transform: translate(var(--spread-x), var(--spread-y)) rotate(var(--rot)) scale(1); }

    .result-area { display: none; max-width: 1080px; margin: 20px auto 0; animation: resultIn .55s ease both; }
    @keyframes resultIn { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
    .spread { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(10px, 2.2vw, 24px); align-items: start; }
    .reading-card { min-width: 0; padding: 10px; border-radius: 24px; background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.03)); border: 1px solid rgba(217,180,95,.25); box-shadow: 0 18px 46px rgba(0,0,0,.34); }
    .card-image-box { width: min(100%, 210px); aspect-ratio: 636 / 1024; margin: 0 auto 14px; position: relative; border-radius: 14px; overflow: hidden; border: 2px solid rgba(217,180,95,.78); box-shadow: 0 0 34px rgba(217,180,95,.18), 0 14px 30px rgba(0,0,0,.42); background: radial-gradient(circle at 50% 18%, rgba(255,241,185,.22), transparent 32%), linear-gradient(145deg, #231238, #0b0819 72%); }
    .card-image-box img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .card-image-box.reversed img { transform: rotate(180deg); }
    .fallback-card { width: 100%; height: 100%; display: none; padding: 14px; text-align: center; place-items: center; background: radial-gradient(circle at 50% 20%, rgba(217,180,95,.22), transparent 32%), linear-gradient(180deg, #211437, #05030c); }
    .fallback-card strong { display: block; color: var(--gold2); font-size: clamp(.95rem, 2.6vw, 1.28rem); line-height: 1.45; text-shadow: 0 0 16px rgba(217,180,95,.4); }
    .fallback-card small { display: block; margin-top: 10px; color: var(--muted); font-size: .76rem; line-height: 1.5; }
    .no-image .fallback-card { display: grid; }
    .no-image img { display: none !important; }
    .card-meta { text-align: center; padding: 0 4px 6px; }
    .slot-name { color: var(--gold2); font-size: .86rem; letter-spacing: .12em; margin-bottom: 7px; }
    .card-name { font-size: clamp(1rem, 2.7vw, 1.22rem); line-height: 1.35; font-weight: 800; }
    .orientation { display: inline-flex; margin-top: 7px; padding: 4px 10px; border-radius: 999px; border: 1px solid rgba(217,180,95,.24); background: rgba(0,0,0,.24); color: var(--muted); font-size: .78rem; }
    .mini-reading { margin: 12px 0 0; color: #efe8ff; line-height: 1.75; font-size: .95rem; text-align: left; }
    .oracle-box { margin: clamp(18px, 4vw, 32px) auto 0; padding: clamp(18px, 3vw, 30px); border-radius: 28px; border: 1px solid rgba(217,180,95,.34); background: radial-gradient(circle at 50% 0%, rgba(217,180,95,.13), transparent 22rem), rgba(6, 5, 18, .72); box-shadow: inset 0 0 46px rgba(217,180,95,.04), 0 18px 60px rgba(0,0,0,.35); }
    .oracle-box h2 { margin: 0 0 14px; color: var(--gold2); font-size: clamp(1.3rem, 4vw, 2.1rem); letter-spacing: .08em; text-align: center; }
    .oracle-text { white-space: pre-line; color: #fff8e9; line-height: 2.02; font-size: clamp(.98rem, 2vw, 1.08rem); }
    .actions { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin-top: 24px; }
    .ghost-btn { width: auto; min-width: 190px; padding: 0 18px; cursor: pointer; color: var(--gold2); background: rgba(255,255,255,.04); border: 1px solid rgba(217,180,95,.35); box-shadow: none; transition: background .2s ease, transform .2s ease; }
    .ghost-btn:hover { background: rgba(217,180,95,.1); transform: translateY(-1px); }
    .note { max-width: 760px; margin: 18px auto 0; text-align: center; color: rgba(239,232,255,.75); font-size: .86rem; line-height: 1.7; }
    @media (max-width: 700px) {
      .app { padding-left: 14px; padding-right: 14px; }
      .controls { grid-template-columns: 1fr; }
      .primary-btn { width: 100%; }
      .deck-stage { height: 410px; }
      .spread { gap: 8px; }
      .reading-card { padding: 7px; border-radius: 18px; }
      .mini-reading { display: none; }
      .oracle-box { border-radius: 22px; }
    }


    #start-btn { position: relative; z-index: 20; -webkit-user-select: none; user-select: none; }
    .is-running #start-btn { opacity: .72; }
    .debug-pill { display:inline-block; margin-top:8px; padding:7px 10px; border:1px solid rgba(217,180,95,.35); border-radius:999px; background:rgba(0,0,0,.25); }

    /* スマホ操作の安定化 */
    button, select { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    .deck-stage { touch-action: manipulation; contain: layout paint; }
    .deck-card, .drawn-card { -webkit-backface-visibility: hidden; backface-visibility: hidden; transform: translateZ(0); }
    @media (max-width: 700px) {
      .deck-card, .drawn-card { transition-duration: .55s; }
      .deck-card.swirl { animation-duration: .95s; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="hero">
      <div class="eyebrow">THREE CARD ORACLE ・ CATEGORY TEXT EDITION</div>
      <h1>三枚神託<br>タロット</h1>
      <p class="lead">大アルカナと小アルカナを合わせた78枚から、三つの山に分けた運命の一枚ずつを引きます。選んだ相談内容に合わせて、カードごとの専用文章を表示します。</p>
    </section>

    <section class="ritual-panel" id="ritual-panel">
      <div class="controls" id="controls">
        <div>
          <label for="category">占いたい内容</label>
          <select id="category">
            <option value="恋愛">恋愛</option>
            <option value="仕事">仕事</option>
            <option value="健康">健康</option>
            <option value="家族">家族</option>
            <option value="人間関係">人間関係</option>
            <option value="ギャンブル">ギャンブル</option>
          </select>
        </div>
        <button class="primary-btn" id="start-btn" type="button" onclick="return window.startTarotRitualSafe(event)" ontouchend="return window.startTarotRitualSafe(event)" onpointerup="return window.startTarotRitualSafe(event)">カードを混ぜる</button>
      </div>

      <p class="stage-title" id="stage-title">裏返した78枚の山が、あなたの問いを待っています。</p>
      <div class="deck-stage" id="deck-stage" aria-live="polite">
        <div class="pile-label" id="pile-label-0">左の山</div>
        <div class="pile-label" id="pile-label-1">中央の山</div>
        <div class="pile-label" id="pile-label-2">右の山</div>
      </div>

      <div class="result-area" id="result-area">
        <div class="spread" id="spread"></div>
        <div class="oracle-box">
          <h2>三枚の神託</h2>
          <div class="oracle-text" id="oracle-text"></div>
          <div class="actions">
            <button class="ghost-btn" type="button" id="again-btn">もう一度占う</button>
          </div>
        </div>
      </div>
    </section>
    <p class="note">画像ファイルが同じフォルダにある場合は自動表示します。未配置のカードは仮カード表示になります。今回の版では、カード表示時の反転・めくり演出を削除し、結果表示時にそのまま表面カードを表示します。</p>
    <p class="note" id="image-debug" style="display:none; color:#ffd88c;"></p>
  </main>

  <script>
    const deck = [
  {
    "id": "major-00",
    "name": "愚者",
    "en": "THE FOOL",
    "file": [
      "愚者.jpg"
    ],
    "arcana": "大アルカナ",
    "keywords": [
      "始まり",
      "自由",
      "未知への一歩"
    ],
    "reversed": [
      "無計画",
      "不安定",
      "見切り発車"
    ],
    "readings": {
      "恋愛": {
        "upright": "【恋愛】愚者の正位置は、心の距離、相手への期待、自分の本音に対して「始まり・自由」の流れを示します。新しい風を受け入れることで、まだ形になっていない可能性が動き出すため、今は状況を恐れず、自然に進む力を信じてよい時です。相手の反応だけで判断せず、自分が安心して向き合える形を選ぶと関係が進みます。 今日の一手は、相手を試す言葉ではなく、素直で短い本音を一つ伝えることです。",
        "reversed": "【恋愛】愚者の逆位置は、心の距離、相手への期待、自分の本音に対して「無計画・不安定」が出やすい状態です。準備不足や楽観の行き過ぎによって、足元が見えにくくなるため、急いで結論を出すほど本心から離れます。焦って答えを迫るより、依存や期待の偏りを整えることが先です。 今日の一手は、相手を試す言葉ではなく、素直で短い本音を一つ伝えることです。"
      },
      "仕事": {
        "upright": "【仕事】愚者の正位置は、役割、評価、責任、次の一手に対して「始まり・自由」の流れを示します。新しい風を受け入れることで、まだ形になっていない可能性が動き出すため、今は状況を恐れず、自然に進む力を信じてよい時です。今の強みを見せる場面です。大きく広げるより、成果に直結する行動を一つ選んでください。 今日の一手は、曖昧な作業を一つだけ具体的な締切と成果物に変えることです。",
        "reversed": "【仕事】愚者の逆位置は、役割、評価、責任、次の一手に対して「無計画・不安定」が出やすい状態です。準備不足や楽観の行き過ぎによって、足元が見えにくくなるため、急いで結論を出すほど本心から離れます。義務感や焦りで動くと精度が落ちます。優先順位を削り、勝ち筋を見直してください。 今日の一手は、曖昧な作業を一つだけ具体的な締切と成果物に変えることです。"
      },
      "健康": {
        "upright": "【健康】愚者の正位置は、心身のバランス、疲労、回復、生活習慣に対して「始まり・自由」の流れを示します。新しい風を受け入れることで、まだ形になっていない可能性が動き出すため、今は状況を恐れず、自然に進む力を信じてよい時です。身体は小さな改善に反応しやすい状態です。睡眠、食事、姿勢のどれか一つを整えるだけでも流れが変わります。 今日の一手は、我慢している負担を一つ減らし、身体の声を記録することです。",
        "reversed": "【健康】愚者の逆位置は、心身のバランス、疲労、回復、生活習慣に対して「無計画・不安定」が出やすい状態です。準備不足や楽観の行き過ぎによって、足元が見えにくくなるため、急いで結論を出すほど本心から離れます。無理を平気だと思い込むほど、後から疲れが出やすい暗示です。休むことを予定として扱ってください。 今日の一手は、我慢している負担を一つ減らし、身体の声を記録することです。"
      },
      "家族": {
        "upright": "【家族】愚者の正位置は、安心感、距離感、役割、言いづらい感情に対して「始まり・自由」の流れを示します。新しい風を受け入れることで、まだ形になっていない可能性が動き出すため、今は状況を恐れず、自然に進む力を信じてよい時です。家族内の空気を整える鍵があります。正しさより、まず安心して話せる余白を作ってください。 今日の一手は、責める前に『今どう感じているか』を短く聞くことです。",
        "reversed": "【家族】愚者の逆位置は、安心感、距離感、役割、言いづらい感情に対して「無計画・不安定」が出やすい状態です。準備不足や楽観の行き過ぎによって、足元が見えにくくなるため、急いで結論を出すほど本心から離れます。近い関係ほど決めつけが出やすい時です。相手の事情を一度確認するだけで衝突を避けられます。 今日の一手は、責める前に『今どう感じているか』を短く聞くことです。"
      },
      "人間関係": {
        "upright": "【人間関係】愚者の正位置は、信頼、境界線、誤解、距離の取り方に対して「始まり・自由」の流れを示します。新しい風を受け入れることで、まだ形になっていない可能性が動き出すため、今は状況を恐れず、自然に進む力を信じてよい時です。関係性の整理に向いた流れです。近づく相手と距離を置く相手を静かに見極めてください。 今日の一手は、無理な返事を即答せず、少し時間を置いてから答えることです。",
        "reversed": "【人間関係】愚者の逆位置は、信頼、境界線、誤解、距離の取り方に対して「無計画・不安定」が出やすい状態です。準備不足や楽観の行き過ぎによって、足元が見えにくくなるため、急いで結論を出すほど本心から離れます。空気を読みすぎると自分の軸が曇ります。全員に合わせる必要はありません。 今日の一手は、無理な返事を即答せず、少し時間を置いてから答えることです。"
      },

      '健康': '健康では、無理を続けることより、回復する余白を作ることが運気の土台になります。',
      '家族': '家族では、正しさの勝ち負けより、安心して話せる空気が流れを変えます。',
      '人間関係': '人間関係では、誰に合わせるかではなく、どこに境界線を引くかが大切です。',
      'ギャンブル': 'ギャンブルでは、流れを読む力以上に、熱くなった時の引き際が結果を守ります。'
    };

    const stage = document.getElementById('deck-stage');
    const title = document.getElementById('stage-title');
    const startBtn = document.getElementById('start-btn');
    const againBtn = document.getElementById('again-btn');
    const categorySelect = document.getElementById('category');
    const resultArea = document.getElementById('result-area');
    const spreadEl = document.getElementById('spread');
    const oracleText = document.getElementById('oracle-text');
    const imageDebug = document.getElementById('image-debug');

    let selected = [];
    let visualCards = [];
    let ritualRunning = false;
    let initialized = false;
    let ritualTimers = [];
    let lastStartAt = 0;
    let startQueued = false;

    // Android / iPhone / PC のどれでも、ボタンから直接ここへ入る安全な起動口。
    // 一部のスマホでは click が発火しない、または touch と click が二重発火するため、ここで吸収する。
    window.startTarotRitualSafe = function(event) {
      if (event) {
        try { event.preventDefault(); } catch (e) {}
        try { event.stopPropagation(); } catch (e) {}
      }
      const now = Date.now();
      if (ritualRunning || startQueued || now - lastStartAt < 700) return false;
      lastStartAt = now;
      startQueued = true;
      window.setTimeout(function() {
        startQueued = false;
        startRitual();
      }, 0);
      return false;
    };
    window.startTarotRitual = window.startTarotRitualSafe;

    function isMobileView() {
      if (window.matchMedia) return window.matchMedia('(max-width: 700px)').matches;
      return (window.innerWidth || document.documentElement.clientWidth || 360) <= 700;
    }

    function schedule(fn, delay) {
      const timer = window.setTimeout(fn, delay);
      ritualTimers.push(timer);
      return timer;
    }

    function clearRitualTimers() {
      ritualTimers.forEach(timer => window.clearTimeout(timer));
      ritualTimers = [];
    }

    function initTarotApp() {
      if (initialized) return;
      initialized = true;
      createDeckVisual();

      const startHandler = function(event) {
        return window.startTarotRitualSafe(event);
      };

      window.startTarotRitual = window.startTarotRitualSafe;
      // passive オプションは古いAndroid WebViewで不安定になることがあるため使わない。
      ['click', 'touchend', 'pointerup'].forEach(function(type) {
        startBtn.addEventListener(type, startHandler, false);
      });
      againBtn.addEventListener('click', resetRitual, false);
      window.addEventListener('resize', () => {
        if (!ritualRunning && resultArea.style.display !== 'block') createDeckVisual();
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initTarotApp, { once: true });
      window.addEventListener('load', initTarotApp, { once: true });
    } else {
      initTarotApp();
    }

    function createDeckVisual() {
      stage.querySelectorAll('.deck-card, .drawn-card').forEach(el => el.remove());
      document.querySelectorAll('.pile-label').forEach(el => el.classList.remove('show'));
      visualCards = [];
      const mobile = isMobileView();
      const count = mobile ? 14 : 36;
      const spreadX = mobile ? 1.15 : 2.0;
      for (let i = 0; i < count; i++) {
        const card = document.createElement('div');
        card.className = 'deck-card';
        const angle = (i - count / 2) * (mobile ? 2.05 : 2.7);
        const x = (i - count / 2) * spreadX;
        const y = Math.sin(i * .9) * (mobile ? 4 : 7);
        card.style.zIndex = i + 1;
        card.style.transform = `translate(${x}px, ${y}px) rotate(${angle}deg)`;
        card.style.setProperty('--angle', `${(i * 33) % 360}deg`);
        card.style.setProperty('--radius', `${mobile ? 56 + (i % 7) * 4 : 90 + (i % 9) * 7}px`);
        card.style.setProperty('--delay', `${-(i % 11) * .07}s`);
        stage.appendChild(card);
        visualCards.push(card);
      }
    }

    function startRitual() {
      if (ritualRunning) return;
      ritualRunning = true;
      clearRitualTimers();
      document.body.classList.add('is-running');
      startBtn.disabled = true;
      startBtn.textContent = 'シャッフル中…';
      categorySelect.disabled = true;
      resultArea.style.display = 'none';
      spreadEl.innerHTML = '';
      oracleText.textContent = '';
      if (imageDebug) imageDebug.style.display = 'none';
      if (!visualCards.length) createDeckVisual();

      title.textContent = 'シャッフルを開始しました。円を描くように、カードが混ざり合っています。';
      visualCards.forEach((card, i) => {
        card.classList.remove('swirl');
        card.style.opacity = '1';
        card.style.filter = 'brightness(1)';
        card.style.transform = `translate(${(i % 7) - 3}px, ${(i % 5) - 2}px) rotate(${(i % 8) - 4}deg) scale(1.03)`;
      });

      const mobile = isMobileView();
      schedule(() => { visualCards.forEach(card => card.classList.add('swirl')); }, 180);
      schedule(splitIntoPiles, mobile ? 1350 : 3000);
      schedule(drawFromPiles, mobile ? 2250 : 4300);
      schedule(showResult, mobile ? 3350 : 5700);
    }

    function splitIntoPiles() {
      title.textContent = '運命の束が、三つの山に分かれます。';
      const mobile = isMobileView();
      const stageWidth = stage.clientWidth || window.innerWidth || 360;
      const gap = mobile ? Math.min(105, Math.max(76, stageWidth * .24)) : 170;
      const pileX = [-gap, 0, gap];
      const pileY = mobile ? [8, -6, 8] : [8, -10, 8];
      visualCards.forEach((card, i) => {
        card.classList.remove('swirl');
        const pile = i % 3;
        const layer = Math.floor(i / 3);
        const jitterX = ((layer % 5) - 2) * (mobile ? 1.4 : 2);
        const jitterY = -layer * (mobile ? .46 : .65);
        const rot = ((layer % 7) - 3) * (mobile ? 1.4 : 1.8);
        card.style.zIndex = 100 + layer;
        card.style.transform = `translate(${pileX[pile] + jitterX}px, ${pileY[pile] + jitterY}px) rotate(${rot}deg) scale(1.02)`;
      });
      document.querySelectorAll('.pile-label').forEach((el, i) => {
        el.style.transform = `translateX(calc(-50% + ${pileX[i]}px))`;
        el.classList.add('show');
      });
    }

    function drawFromPiles() {
      title.textContent = 'それぞれの山から、一枚ずつ選ばれました。';
      selected = pickThreeCards();
      visualCards.forEach((card) => {
        card.style.opacity = '0';
        card.style.filter = 'blur(4px) brightness(.45)';
        card.style.transform = `${card.style.transform} scale(.82)`;
      });
      document.querySelectorAll('.pile-label').forEach(el => el.classList.remove('show'));
      const spread = Math.min(170, Math.max(82, (stage.clientWidth || window.innerWidth) * .26));
      [-1, 0, 1].forEach((pos, index) => {
        const card = document.createElement('div');
        card.className = 'drawn-card';
        card.style.setProperty('--spread-x', `${pos * spread}px`);
        card.style.setProperty('--spread-y', `0px`);
        card.style.setProperty('--rot', `${pos * 2.5}deg`);
        card.style.zIndex = 300 + index;
        stage.appendChild(card);
        requestAnimationFrame(() => card.classList.add('arrive'));
      });
    }

    function showResult() {
      title.textContent = 'あなたの問いに対する三枚の物語です。';
      stage.querySelectorAll('.drawn-card').forEach(el => el.remove());
      spreadEl.innerHTML = '';
      const category = categorySelect.value;
      selected.forEach((entry, index) => {
        spreadEl.appendChild(createReadingCard(entry, slots[index], category));
      });
      oracleText.textContent = makeOracle(selected, category);
      resultArea.style.display = 'block';
      ritualRunning = false;
      document.body.classList.remove('is-running');
      try {
        resultArea.scrollIntoView({ behavior: isMobileView() ? 'auto' : 'smooth', block: 'nearest' });
      } catch (e) {
        resultArea.scrollIntoView();
      }
    }

    function resetRitual() {
      clearRitualTimers();
      selected = [];
      ritualRunning = false;
      startBtn.disabled = false;
      startBtn.textContent = 'カードを混ぜる';
      categorySelect.disabled = false;
      if (imageDebug) imageDebug.style.display = 'none';
      document.body.classList.remove('is-running');
      resultArea.style.display = 'none';
      title.textContent = '裏返した78枚の山が、あなたの問いを待っています。';
      createDeckVisual();
      try {
        document.getElementById('ritual-panel').scrollIntoView({ behavior: isMobileView() ? 'auto' : 'smooth', block: 'start' });
      } catch (e) {
        document.getElementById('ritual-panel').scrollIntoView();
      }
    }

    function pickThreeCards() {
      const copy = [...deck];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy.slice(0, 3).map(card => ({ card, reversed: Math.random() < 0.5 }));
    }

    function createReadingCard(entry, slot, category) {
      const { card, reversed } = entry;
      const wrapper = document.createElement('article');
      wrapper.className = 'reading-card';
      const imageBox = document.createElement('div');
      imageBox.className = `card-image-box${reversed ? ' reversed' : ''}`;
      const img = document.createElement('img');
      img.alt = card.name;
      setImageWithFallback(img, card.file, imageBox);
      const fallback = document.createElement('div');
      fallback.className = 'fallback-card';
      fallback.innerHTML = `<div><strong>${card.name}</strong><small>${card.en}<br>${card.arcana}${card.suit ? '・' + card.suitTheme : ''}</small></div>`;
      imageBox.append(img, fallback);
      const meta = document.createElement('div');
      meta.className = 'card-meta';
      meta.innerHTML = `
        <div class="slot-name">${slot.name}</div>
        <div class="card-name">${card.name}</div>
        <span class="orientation">${reversed ? '逆位置' : '正位置'} / ${card.arcana}</span>
        <p class="mini-reading">${escapeHTML(makeCardMessage(entry, slot, category))}</p>
      `;
      wrapper.append(imageBox, meta);
      return wrapper;
    }

    function setImageWithFallback(img, files, imageBox) {
      let idx = 0;
      const candidates = buildImageCandidates(files);
      const tried = [];

      function tryNext() {
        if (idx >= candidates.length) {
          imageBox.classList.add('no-image');
          if (imageDebug) {
            imageDebug.style.display = 'block';
            imageDebug.innerHTML = '<span class="debug-pill">画像が見つからないカードがあります。例：' + escapeHTML((tried[0] || '愚者.jpg')) + ' を同じフォルダに置いてください。</span>';
          }
          return;
        }
        const src = candidates[idx++];
        tried.push(src);
        img.src = src;
      }

      img.onload = function() {
        imageBox.classList.remove('no-image');
      };
      img.onerror = tryNext;
      tryNext();
    }

    function buildImageCandidates(files) {
      const sourceFiles = Array.isArray(files) ? files : [files];
      const exts = ['.jpg', '.jpeg', '.JPG', '.JPEG', '.png', '.PNG', '.webp', '.WEBP'];
      const candidates = [];
      const pushUnique = function(value) {
        if (!value) return;
        if (!candidates.includes(value)) candidates.push(value);
      };
      const stripExt = function(name) { return String(name).replace(/\.(jpg|jpeg|png|webp)$/i, ''); };
      const safeURI = function(name) {
        try {
          return name.split('/').map(function(part) { return encodeURIComponent(part); }).join('/');
        } catch (e) {
          return name;
        }
      };

      sourceFiles.forEach(function(file) {
        const base = stripExt(file);
        const names = [base];
        // よく起きる表記違いを吸収する。
        if (base === '死') names.push('死神');
        if (base === '死神') names.push('死');
        if (base === '法王') names.push('教皇');
        if (base === '教皇') names.push('法王');
        if (base === '恋人たち') names.push('恋人');
        if (base === '恋人') names.push('恋人たち');
        if (base === '吊るされた男') names.push('吊られた男');
        if (base === '吊られた男') names.push('吊るされた男');
        if (/^ワンドのA$/.test(base)) names.push('ワンドA', 'ワンドの1', 'ワンド1', 'ワンド_ACE', 'wands_ace');
        const numMatch = base.match(/^ワンドの(\d+)$/);
        if (numMatch) names.push('ワンド' + numMatch[1], 'ワンド_' + numMatch[1], 'wands_' + numMatch[1]);
        const court = base.match(/^ワンドの(.+)$/);
        if (court) names.push('ワンド' + court[1], 'wands_' + court[1]);

        names.forEach(function(name) {
          exts.forEach(function(ext) {
            const filename = name + ext;
            pushUnique(filename);
            pushUnique('./' + filename);
            pushUnique(safeURI(filename));
            pushUnique('./' + safeURI(filename));
          });
        });
      });
      return candidates;
    }

    function orientationKey(entry) { return entry.reversed ? 'reversed' : 'upright'; }

    function makeCardMessage(entry, slot, category) {
      const base = entry.card.readings[category][orientationKey(entry)];
      if (slot.label === '現在') return `現在の位置：${base}`;
      if (slot.label === '課題') return `課題の位置：${base}`;
      return `助言の位置：${base}`;
    }

    function makeOracle(entries, category) {
      const [a, b, c] = entries;
      const msgA = a.card.readings[category][orientationKey(a)];
      const msgB = b.card.readings[category][orientationKey(b)];
      const msgC = c.card.readings[category][orientationKey(c)];
      const arcanaCount = entries.filter(e => e.card.arcana === '大アルカナ').length;
      const power = arcanaCount >= 2
        ? '大アルカナが多いため、今回の結果は一時的な気分よりも、少し大きな転機や方向修正を示しています。'
        : '小アルカナが中心のため、今回の結果は日々の行動、言葉、選択を少し変えることで現実が動きやすい配置です。';
      return `【${category}の総合リーディング】
${categorySummaries[category]}

一枚目の「${a.card.name}」は現在を示します。
${msgA}

二枚目の「${b.card.name}」は課題を示します。
${msgB}

三枚目の「${c.card.name}」は助言を示します。
${msgC}

${power}`;
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, (tag) => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[tag]));
    }
  </script>
</body>
